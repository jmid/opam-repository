name: Missing x-maintenance-intent

on:
  pull_request:

jobs:

  changed_files:
    runs-on: ubuntu-latest
    name: Test changed-files
    steps:
      - uses: actions/checkout@v4

      - name: Collect changed opam files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: packages/**.opam
          files_ignore: packages/conf-*/*.opam

      - name: Check for missing x-maintenance-intent
        env:
          ADDED_FILES: ${{ steps.changed-files.outputs.added_files }}
        run: |
          missing=false
          for file in ${ADDED_FILES}; do
	    echo $file
            opam show -f 'x-maintenance-intent:' $file
            retVal=$?
            if [ retVal -ne 0 ]; then
              echo $file "is missing an x-maintenance-intent: entry"
              missing=true
            fi
          done
          if [ $missing = true ] ; then
            exit 1
          fi
